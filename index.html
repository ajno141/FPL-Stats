<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FPL Player Lab</title>


<style>

:root {

    --bg: #f4f5f7;
    --card: #ffffff;
    --dark: #111827;
    --dark2: #1b2636;
    --green: #00a86b;
    --green-light: #e9f8f2;
    --purple: #7254e8;
    --text: #17202d;
    --muted: #8993a3;
    --border: #e4e8ee;

}


* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: var(--bg);

    color: var(--text);

}


.app {
    min-height: 100vh;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    position: fixed;

    top: 0;
    left: 0;
    bottom: 0;

    width: 230px;

    background: var(--dark);

    color: white;

    padding: 25px 14px;

    z-index: 20;

}


.logo {
    padding: 0 12px 30px;
}


.logo-title {

    font-size: 24px;

    font-weight: 900;

}


.logo-title span {
    color: #00d084;
}


.logo-sub {

    margin-top: 5px;

    font-size: 11px;

    color: #768294;

}


.nav-title {

    color: #657184;

    font-size: 10px;

    text-transform: uppercase;

    margin:
        18px 12px 8px;

}


.nav-item {

    padding: 11px 12px;

    border-radius: 8px;

    color: #aeb7c5;

    font-size: 13px;

    margin-bottom: 3px;

}


.nav-item.active {

    background: var(--dark2);

    color: white;

}


/* =========================================================
   MAIN
========================================================= */

.main {

    margin-left: 230px;

    min-height: 100vh;

}


.topbar {

    height: 70px;

    background: white;

    border-bottom:
        1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 28px;

    position: sticky;

    top: 0;

    z-index: 10;

}


.page-title {

    font-size: 20px;

    font-weight: 900;

}


.page-subtitle {

    margin-top: 4px;

    font-size: 12px;

    color: var(--muted);

}


.live {

    display: flex;

    align-items: center;

    gap: 7px;

    color: var(--muted);

    font-size: 12px;

}


.live-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: var(--green);

}


/* =========================================================
   CONTENT
========================================================= */

.content {

    max-width: 1700px;

    margin: auto;

    padding: 25px;

}


/* =========================================================
   SUMMARY
========================================================= */

.summary {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 14px;

    margin-bottom: 18px;

}


.summary-card {

    background: white;

    border:
        1px solid var(--border);

    border-radius: 12px;

    padding: 17px;

}


.summary-label {

    color: var(--muted);

    font-size: 10px;

    font-weight: 800;

}


.summary-number {

    margin-top: 8px;

    font-size: 25px;

    font-weight: 900;

}


/* =========================================================
   FILTERS
========================================================= */

.filters-card {

    background: white;

    border:
        1px solid var(--border);

    border-radius: 12px;

    padding: 16px;

    margin-bottom: 18px;

}


.filters {

    display: grid;

    grid-template-columns:
        2fr 1fr 1fr;

    gap: 9px;

}


input,
select {

    height: 42px;

    width: 100%;

    border:
        1px solid var(--border);

    border-radius: 7px;

    padding: 0 12px;

    background: #fafbfc;

    outline: none;

}


input:focus,
select:focus {

    border-color:
        var(--green);

}


.positions {

    display: flex;

    gap: 7px;

    margin-top: 11px;

}


.position-btn {

    border:
        1px solid var(--border);

    background: white;

    padding: 8px 15px;

    border-radius: 7px;

    font-size: 11px;

    font-weight: 800;

    cursor: pointer;

}


.position-btn.active {

    background: var(--green);

    border-color: var(--green);

    color: white;

}


/* =========================================================
   HEADER
========================================================= */

.players-header {

    display: flex;

    justify-content: space-between;

    margin-bottom: 12px;

}


.players-title {

    font-size: 16px;

    font-weight: 900;

}


.players-count {

    font-size: 12px;

    color: var(--muted);

}


/* =========================================================
   GRID
========================================================= */

.player-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(250px, 1fr)
        );

    gap: 14px;

}


/* =========================================================
   PLAYER CARD
========================================================= */

.player-card {

    background: white;

    border:
        1px solid var(--border);

    border-radius: 13px;

    overflow: hidden;

    cursor: pointer;

    transition: .15s;

}


.player-card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.08);

}


.card-top {

    height: 108px;

    background:
        linear-gradient(
            135deg,
            #111827,
            #243348
        );

    position: relative;

}


.position-tag {

    position: absolute;

    left: 10px;
    top: 10px;

    color: white;

    background:
        rgba(255,255,255,.13);

    padding: 5px 7px;

    border-radius: 5px;

    font-size: 9px;

    font-weight: 900;

}


.price-tag {

    position: absolute;

    right: 10px;
    top: 10px;

    color: white;

    font-size: 12px;

    font-weight: 900;

}


.club-crest {

    position: absolute;

    width: 62px;
    height: 62px;

    object-fit: contain;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

}


.card-body {

    padding: 13px;

}


.player-name {

    font-size: 15px;

    font-weight: 900;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.club-name {

    color: var(--muted);

    font-size: 11px;

    margin-top: 5px;

}


.main-stats {

    display: flex;

    justify-content: space-between;

    margin-top: 13px;

}


.big-number {

    font-size: 24px;

    font-weight: 900;

    color: var(--green);

}


.bps-number {

    font-size: 24px;

    font-weight: 900;

    color: var(--purple);

}


.stat-label {

    font-size: 9px;

    color: var(--muted);

    text-transform: uppercase;

}


.mini-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 5px;

    margin-top: 12px;

}


.mini-stat {

    background: #f6f7f9;

    border-radius: 6px;

    padding: 7px 3px;

    text-align: center;

}


.mini-value {

    font-size: 12px;

    font-weight: 900;

}


.mini-label {

    font-size: 8px;

    color: var(--muted);

    margin-top: 3px;

}


/* =========================================================
   MODAL
========================================================= */

.overlay {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.7);

    z-index: 100;

    padding: 20px;

    align-items: center;

    justify-content: center;

}


.overlay.show {

    display: flex;

}


.modal {

    width: 100%;

    max-width: 850px;

    max-height: 92vh;

    overflow-y: auto;

    background: white;

    border-radius: 16px;

}


.modal-top {

    height: 210px;

    background:
        linear-gradient(
            135deg,
            #111827,
            #26364d
        );

    position: relative;

}


.close {

    position: absolute;

    right: 15px;
    top: 15px;

    width: 34px;
    height: 34px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,.15);

    color: white;

    font-size: 20px;

    cursor: pointer;

}


.modal-crest {

    position: absolute;

    width: 100px;
    height: 100px;

    object-fit: contain;

    left: 50%;
    top: 45%;

    transform:
        translate(-50%, -50%);

}


.modal-name {

    position: absolute;

    bottom: 18px;
    left: 22px;

    color: white;

    font-size: 25px;

    font-weight: 900;

}


.modal-body {

    padding: 22px;

}


.detail-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 9px;

}


.detail {

    background: #f7f8fa;

    border-radius: 8px;

    padding: 12px;

}


.detail-label {

    color: var(--muted);

    font-size: 9px;

    text-transform: uppercase;

}


.detail-value {

    margin-top: 7px;

    font-size: 19px;

    font-weight: 900;

}


.detail-table {

    width: 100%;

    margin-top: 20px;

    border-collapse: collapse;

}


.detail-table td {

    padding: 10px;

    border-bottom:
        1px solid var(--border);

    font-size: 12px;

}


.detail-table td:last-child {

    text-align: right;

    font-weight: 900;

}

loadAll();
                
})();
</script>

</body>
</html>
