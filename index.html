<!DOCTYPE html>

<head>

<style>

.detail {

/* =========================================================
   FIXTURES 2026/27
========================================================= */

(function () {

    let fixtureTeams = {};
    let fixtures = [];

    const fixtureTeam =
        document.getElementById("fixtureTeam");

    const fixturesGrid =
        document.getElementById("fixturesGrid");

    const fixtureCount =
        document.getElementById("fixtureCount");


    /* =====================================================
       DATE
    ===================================================== */

    function formatFixtureDate(dateString) {

        if (!dateString) {
            return "TBC";
        }

        const date = new Date(dateString);

        if (Number.isNaN(date.getTime())) {
            return "TBC";
        }

        return date.toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "short",
            year: "numeric"
        });

    }


    /* =====================================================
       TIME
    ===================================================== */

    function formatFixtureTime(dateString) {

        if (!dateString) {
            return "TBC";
        }

        const date = new Date(dateString);

        if (Number.isNaN(date.getTime())) {
            return "TBC";
        }

        return date.toLocaleTimeString("en-GB", {
            hour: "2-digit",
            minute: "2-digit"
        });

    }


    /* =====================================================
       LOAD FIXTURES.JSON
    ===================================================== */

    async function loadFixtures() {

        try {

            fixturesGrid.innerHTML = `
                <div class="fixture-loading">
                    Loading Premier League fixtures...
                </div>
            `;


            /*
             * Fixtures se učitavaju sa GitHub Pages-a,
             * a NE direktno sa FPL API-ja.
             */

            const response = await fetch(
                "fixtures.json?t=" + Date.now(),
                {
                    cache: "no-store"
                }
            );


            if (!response.ok) {

                throw new Error(
                    "fixtures.json HTTP error: " +
                    response.status
                );

            }


            const data = await response.json();


            /*
             * Podržavamo format:
             *
             * {
             *   "teams": [...],
             *   "fixtures": [...]
             * }
             */


            if (Array.isArray(data)) {

                fixtures = data;

            } else {

                fixtures =
                    Array.isArray(data.fixtures)
                    ? data.fixtures
                    : [];

            }


            /*
             * Učitaj klubove.
             */

            fixtureTeams = {};


            if (
                !Array.isArray(data) &&
                Array.isArray(data.teams)
            ) {

                data.teams.forEach(team => {

                    if (
                        team.id !== undefined &&
                        team.name
                    ) {

                        fixtureTeams[
                            team.id
                        ] = team.name;

                    }

                });

            }


            /*
             * Ako fixtures.json koristi team_h_name
             * i team_a_name, napravimo podršku i za to.
             */

            fixtures.forEach(fixture => {

                if (
                    fixture.team_h !== undefined &&
                    fixture.team_h_name
                ) {

                    fixtureTeams[
                        fixture.team_h
                    ] =
                        fixture.team_h_name;

                }


                if (
                    fixture.team_a !== undefined &&
                    fixture.team_a_name
                ) {

                    fixtureTeams[
                        fixture.team_a
                    ] =
                        fixture.team_a_name;

                }

            });


            /*
             * Ako nema naziva klubova u teams objektu,
             * pokušajmo ih pronaći direktno u fixture objektima.
             */

            fixtures.forEach(fixture => {

                if (
                    fixture.team_h_name &&
                    fixture.team_h !== undefined
                ) {

                    fixtureTeams[
                        fixture.team_h
                    ] =
                        fixture.team_h_name;

                }


                if (
                    fixture.team_a_name &&
                    fixture.team_a !== undefined
                ) {

                    fixtureTeams[
                        fixture.team_a
                    ] =
                        fixture.team_a_name;

                }

            });


            /*
             * Napravi dropdown klubova.
             */

            fixtureTeam.innerHTML = `
                <option value="ALL">
                    All Teams
                </option>
            `;


            const sortedTeams =
                Object.entries(
                    fixtureTeams
                ).sort(
                    (a, b) =>
                        a[1].localeCompare(
                            b[1]
                        )
                );


            sortedTeams.forEach(
                ([id, name]) => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value = id;

                    option.textContent = name;

                    fixtureTeam.appendChild(
                        option
                    );

                }
            );


            /*
             * Sortiraj utakmice po Gameweeku
             * i datumu.
             */

            fixtures.sort(
                (a, b) => {

                    const eventA =
                        Number(
                            a.event ??
                            a.gameweek ??
                            999
                        );

                    const eventB =
                        Number(
                            b.event ??
                            b.gameweek ??
                            999
                        );


                    if (
                        eventA !==
                        eventB
                    ) {

                        return (
                            eventA -
                            eventB
                        );

                    }


                    const dateA =
                        new Date(
                            a.kickoff_time ||
                            a.date ||
                            "9999-12-31"
                        );

                    const dateB =
                        new Date(
                            b.kickoff_time ||
                            b.date ||
                            "9999-12-31"
                        );


                    return dateA - dateB;

                }
            );


            fixtureCount.textContent =
                `${fixtures.length} fixtures`;


            renderFixtures();


        } catch (error) {

            console.error(
                "Fixtures error:",
                error
            );


            fixtureCount.textContent =
                "Error";


            fixturesGrid.innerHTML = `
                <div class="fixture-error">

                    Could not load Premier League fixtures.

                    <br><br>

                    Make sure
                    <strong>fixtures.json</strong>
                    exists in the root of your GitHub Pages repository.

                </div>
            `;

        }

    }


    /* =====================================================
       RENDER FIXTURES
    ===================================================== */

    function renderFixtures() {

        const selectedTeam =
            fixtureTeam.value;


        const filtered =
            fixtures.filter(
                fixture => {

                    if (
                        selectedTeam ===
                        "ALL"
                    ) {

                        return true;

                    }


                    return (

                        String(
                            fixture.team_h
                        ) ===
                        String(
                            selectedTeam
                        )

                        ||

                        String(
                            fixture.team_a
                        ) ===
                        String(
                            selectedTeam
                        )

                    );

                }
            );


        if (
            filtered.length === 0
        ) {

            fixturesGrid.innerHTML = `
                <div class="fixture-empty">
                    No fixtures found.
                </div>
            `;

            return;

        }


        const gameweeks = {};


        filtered.forEach(
            fixture => {

                const gw =
                    fixture.event ??
                    fixture.gameweek ??
                    "TBC";


                if (
                    !gameweeks[gw]
                ) {

                    gameweeks[gw] = [];

                }


                gameweeks[gw].push(
                    fixture
                );

            }
        );


        fixturesGrid.innerHTML = "";


        Object.keys(gameweeks)
            .sort(
                (a, b) =>
                    Number(a) -
                    Number(b)
            )
            .forEach(
                gw => {

                    const games =
                        gameweeks[gw];


                    const gameweek =
                        document.createElement(
                            "div"
                        );


                    gameweek.className =
                        "fixture-gameweek";


                    gameweek.innerHTML = `
                        <div
                            class="fixture-gameweek-header">

                            <div
                                class="fixture-gameweek-title">

                                Gameweek ${gw}

                            </div>

                            <div
                                class="fixture-gameweek-count">

                                ${games.length}
                                ${
                                    games.length === 1
                                    ? "match"
                                    : "matches"
                                }

                            </div>

                        </div>
                    `;


                    games.forEach(
                        fixture => {

                            /*
                             * Nazivi klubova mogu doći
                             * iz teams objekta ili direktno
                             * iz fixture objekta.
                             */

                            const home =
                                fixture.team_h_name ||
                                fixtureTeams[
                                    fixture.team_h
                                ] ||
                                "Unknown";


                            const away =
                                fixture.team_a_name ||
                                fixtureTeams[
                                    fixture.team_a
                                ] ||
                                "Unknown";


                            const kickoff =
                                fixture.kickoff_time ||
                                fixture.date ||
                                null;


                            const row =
                                document.createElement(
                                    "div"
                                );


                            row.className =
                                "fixture-row";


                            row.innerHTML = `

                                <div
                                    class="fixture-date">

                                    ${
                                        formatFixtureDate(
                                            kickoff
                                        )
                                    }

                                </div>


                                <div
                                    class="fixture-home">

                                    ${home}

                                </div>


                                <div
                                    class="fixture-time">

                                    ${
                                        formatFixtureTime(
                                            kickoff
                                        )
                                    }

                                </div>


                                <div
                                    class="fixture-away">

                                    ${away}

                                </div>

                            `;


                            gameweek.appendChild(
                                row
                            );

                        }
                    );


                    fixturesGrid.appendChild(
                        gameweek
                    );

                }
            );

    }


    /* =====================================================
       FILTER
    ===================================================== */

    fixtureTeam.addEventListener(
        "change",
        renderFixtures
    );


    /* =====================================================
       START
    ===================================================== */

    loadFixtures();

})();
