<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FPL Player Lab</title>

<style>

:root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #172033;
    --muted: #7b8497;
    --border: #e7eaf0;
    --accent: #00a86b;
    --accent-dark: #078457;
    --dark: #101828;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

.header {
    background: linear-gradient(
        135deg,
        #101828,
        #18243b
    );

    color: white;
    padding: 28px 20px 34px;
}

.header-inner {
    max-width: 1500px;
    margin: auto;
}

.logo {
    font-size: 27px;
    font-weight: 800;
}

.logo span {
    color: #39d98a;
}

.subtitle {
    margin-top: 7px;
    color: #b8c1d1;
}

/* MAIN */

.container {
    max-width: 1500px;
    margin: -18px auto 50px;
    padding: 0 18px;
}

/* TOP CARD */

.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 5px 20px rgba(16,24,40,.06);
}

/* CONTROLS */

.controls {
    display: grid;
    grid-template-columns:
        1fr
        180px
        180px;

    gap: 10px;
}

input,
select {
    width: 100%;
    padding: 12px 13px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: white;
    color: var(--text);

    font-size: 14px;
}

input:focus,
select:focus {
    outline: none;
    border-color: var(--accent);
}

/* POSITION BUTTONS */

.position-buttons {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
}

.position-buttons button {
    border: 1px solid var(--border);
    background: white;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    color: var(--text);
}

.position-buttons button.active {
    background: var(--dark);
    color: white;
    border-color: var(--dark);
}

/* INFO */

.info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin: 22px 0 12px;

    color: var(--muted);
    font-size: 14px;
}

/* TABLE */

.table-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;

    box-shadow: 0 5px 20px rgba(16,24,40,.06);
}

.table-scroll {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 1250px;
    border-collapse: collapse;
}

thead {
    background: #fafbfc;
}

th {
    padding: 13px 14px;

    border-bottom: 1px solid var(--border);

    color: var(--muted);

    font-size: 12px;
    font-weight: 700;

    text-align: left;

    cursor: pointer;

    white-space: nowrap;
}

th:hover {
    color: var(--accent-dark);
}

td {
    padding: 13px 14px;

    border-bottom: 1px solid var(--border);

    font-size: 14px;

    white-space: nowrap;
}

tbody tr:hover {
    background: #f8fafc;
}

/* PLAYER */

.player-name {
    font-weight: 700;
}

.club {
    color: var(--muted);
    font-size: 13px;
}

/* POSITIONS */

.badge {
    display: inline-block;

    padding: 4px 7px;

    border-radius: 6px;

    background: #eef2f6;

    font-size: 11px;
    font-weight: 800;
}

/* PRICE */

.price {
    font-weight: 700;
}

/* NUMBERS */

.number {
    font-variant-numeric: tabular-nums;
}

/* LOADING */

.loading {
    padding: 45px;
    text-align: center;
    color: var(--muted);
}

/* MOBILE */

@media(max-width: 800px) {

    .controls {
        grid-template-columns: 1fr;
    }

    .header {
        padding: 22px 15px 30px;
    }

    .container {
        padding: 0 10px;
    }

    .info-row {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
    }
}

</style>
</head>

<body>

<header class="header">

<div class="header-inner">

<div class="logo">
FPL <span>PLAYER LAB</span>
</div>

<div class="subtitle">
All players · Season statistics · Official FPL data
</div>

</div>

</header>


<main class="container">


<div class="panel">

<div class="controls">

<input
id="search"
type="text"
placeholder="Search players..."
>

<select id="club">

<option value="ALL">
All clubs
</option>

</select>

<select id="sort">

<option value="pts">
Sort: Points
</option>

<option value="price">
Sort: Price
</option>

<option value="bonus">
Sort: Bonus
</option>

<option value="bps">
Sort: BPS
</option>

<option value="dc">
Sort: Defensive Contribution
</option>

<option value="xg">
Sort: xG
</option>

<option value="xa">
Sort: xA
</option>

<option value="xgi">
Sort: xGI
</option>

<option value="goals">
Sort: Goals
</option>

<option value="assists">
Sort: Assists
</option>

<option value="minutes">
Sort: Minutes
</option>

</select>

</div>


<div class="position-buttons">

<button
class="active"
data-position="ALL">
All
</button>

<button data-position="GK">
GKP
</button>

<button data-position="DEF">
DEF
</button>

<button data-position="MID">
MID
</button>

<button data-position="FWD">
FWD
</button>

</div>

</div>


<div class="info-row">

<div id="count">
Loading players...
</div>

<div>
Season totals
</div>

</div>


<div class="table-card">

<div class="table-scroll">

<div id="content">

<div class="loading">
Loading FPL statistics...
</div>

</div>

</div>

</div>


</main>


<script>

const clubs = [

"Arsenal",
"Aston_Villa",
"Bournemouth",
"Brentford",
"Brighton",
"Burnley",
"Chelsea",
"Crystal_Palace",
"Everton",
"Fulham",
"Leeds",
"Liverpool",
"Manchester_City",
"Manchester_United",
"Newcastle_United",
"Nottingham_Forest",
"Sunderland",
"Tottenham_Hotspur",
"West_Ham",
"Wolverhampton_Wanderers"

];


let players = [];

let position =
"ALL";


const search =
document.getElementById("search");

const club =
document.getElementById("club");

const sort =
document.getElementById("sort");

const content =
document.getElementById("content");

const count =
document.getElementById("count");


/* CLUBS */

clubs.forEach(c => {

    const option =
    document.createElement("option");

    option.value = c;

    option.textContent =
    c.replaceAll("_", " ");

    club.appendChild(option);

});


/* LOAD ONE CLUB */

async function loadClub(c) {

    try {

        const response =
        await fetch(
            `FPL_STATS/${c}.txt?t=${Date.now()}`
        );

        if (!response.ok) {
            return [];
        }

        const text =
        await response.text();

        return parseTXT(text, c);

    } catch {

        return [];

    }

}


/* PARSE TXT */

function parseTXT(text, clubName) {

    const result = [];

    const lines =
    text.split("\n");

    let currentPosition = "";

    for (
        let line of lines
    ) {

        line = line.trim();

        if (!line) continue;


        if (
            line === "GOALKEEPERS"
        ) {

            currentPosition =
            "GK";

            continue;
        }


        if (
            line === "DEFENDERS"
        ) {

            currentPosition =
            "DEF";

            continue;
        }


        if (
            line === "MIDFIELDERS"
        ) {

            currentPosition =
            "MID";

            continue;
        }


        if (
            line === "ATTACKERS"
        ) {

            currentPosition =
            "FWD";

            continue;
        }


        if (
            line.startsWith("PLAYER") ||
            line.startsWith("---") ||
            line.startsWith("===") ||
            line.startsWith("FPL SEASON") ||
            line.startsWith("Updated:") ||
            line.startsWith("Current GW:") ||
            line.startsWith("Statistics through") ||
            line.startsWith("ALL STATISTICS") ||
            line.startsWith("PTS =") ||
            line.startsWith("BONUS =") ||
            line.startsWith("BPS =") ||
            line.startsWith("DC =") ||
            line.startsWith("xG =") ||
            line.startsWith("xA =") ||
            line.startsWith("xGI =")
        ) {

            continue;

        }


        if (!currentPosition)
            continue;


        const parts =
        line.split(/\s+/);


        if (parts.length < 14)
            continue;


        result.push({

            player:
            parts[0],

            pos:
            parts[1],

            price:
            parts[2],

            pts:
            Number(parts[3]),

            bonus:
            Number(parts[4]),

            bps:
            Number(parts[5]),

            dc:
            Number(parts[6]),

            xg:
            Number(parts[7]),

            xa:
            Number(parts[8]),

            xgi:
            Number(parts[9]),

            goals:
            Number(parts[10]),

            assists:
            Number(parts[11]),

            minutes:
            Number(parts[12]),

            ownership:
            parts[13],

            club:
            clubName.replaceAll(
                "_",
                " "
            )

        });

    }

    return result;

}


/* LOAD ALL */

async function loadAll() {

    players = [];

    for (
        const c of clubs
    ) {

        const data =
        await loadClub(c);

        players.push(
            ...data
        );

    }

    render();

}


/* RENDER */

function render() {

    const query =
    search.value
        .toLowerCase()
        .trim();


    const selectedClub =
    club.value;


    const selectedSort =
    sort.value;


    let filtered =
    players.filter(p => {

        if (
            position !== "ALL" &&
            p.pos !== position
        ) {
            return false;
        }


        if (
            selectedClub !== "ALL" &&
            p.club.replaceAll(
                " ",
                "_"
            ) !== selectedClub
        ) {
            return false;
        }


        if (
            query &&
            !p.player
                .toLowerCase()
                .includes(query)
        ) {
            return false;
        }


        return true;

    });


    filtered.sort(
        (a,b) => {

            const A =
            a[selectedSort];

            const B =
            b[selectedSort];


            if (
                typeof A === "number" &&
                typeof B === "number"
            ) {

                return B - A;

            }


            return String(B)
                .localeCompare(
                    String(A)
                );

        }
    );


    count.textContent =
    `${filtered.length} players`;


    let html = `

<table>

<thead>

<tr>

<th>PLAYER</th>
<th>CLUB</th>
<th>POS</th>
<th>PRICE</th>
<th>PTS</th>
<th>BONUS</th>
<th>BPS</th>
<th>DC</th>
<th>xG</th>
<th>xA</th>
<th>xGI</th>
<th>G</th>
<th>A</th>
<th>MIN</th>
<th>OWN</th>

</tr>

</thead>

<tbody>
`;


    for (
        const p of filtered
    ) {

        html += `

<tr>

<td>

<div class="player-name">
${p.player}
</div>

</td>


<td>

<div class="club">
${p.club}
</div>

</td>


<td>

<span class="badge">
${p.pos}
</span>

</td>


<td class="price">
${p.price}
</td>


<td class="number">
${p.pts}
</td>


<td class="number">
${p.bonus}
</td>


<td class="number">
${p.bps}
</td>


<td class="number">
${p.dc}
</td>


<td class="number">
${p.xg}
</td>


<td class="number">
${p.xa}
</td>


<td class="number">
${p.xgi}
</td>


<td class="number">
${p.goals}
</td>


<td class="number">
${p.assists}
</td>


<td class="number">
${p.minutes}
</td>


<td>
${p.ownership}
</td>

</tr>

`;

    }


    html += `

</tbody>

</table>
`;


    content.innerHTML =
    html;

}


/* EVENTS */

search.addEventListener(
    "input",
    render
);

club.addEventListener(
    "change",
    render
);

sort.addEventListener(
    "change",
    render
);


document
.querySelectorAll(
    ".position-buttons button"
)
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(
                ".position-buttons button"
            )
            .forEach(b =>
                b.classList.remove(
                    "active"
                )
            );

            button.classList.add(
                "active"
            );

            position =
            button.dataset.position;

            render();

        }
    );

});


loadAll();

</script>

</body>
</html>
