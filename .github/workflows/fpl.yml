name: FPL Statistics Update

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-fpl-stats:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run FPL script
        run: |
          python fpl_stats.py

      - name: Save updated statistics
        run: |
          git config user.name "FPL Stats Bot"
          git config user.email "fpl-stats-bot@users.noreply.github.com"

          git add FPL_STATS/

          git diff --cached --quiet || git commit -m "Update FPL statistics"

          git push
